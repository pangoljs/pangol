# Actions are pinned to commit SHAs (see ci.yml), so they only move when Dependabot proposes it.
# cooldown: wait a week after a release before proposing it, so a compromised release has time
# to be caught and yanked first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      dev-dependencies: { dependency-type: development }
