name: release
# Stages pangol for v* tags and create-pangol for create-pangol-v* tags. Each tag must match
# the selected package version. Prereleases go to their own dist-tag (alpha), never `latest`.
#
# Auth: npm trusted publishing (OIDC, no token): pangoljs/pangol, workflow release.yml, environment
# npm, with "Allow npm publish" and "Allow npm dist-tag" off. This workflow can only stage a version;
# it goes public when a maintainer approves it with 2FA:
#   npm stage list pangol
#   npm stage approve <stage-id>
# A stolen workflow or repository can therefore not publish a release on its own.
on:
  push:
    tags: ['v*', 'create-pangol-v*']
permissions:
  contents: read
  id-token: write # trusted publishing and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Select package and verify version
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            create-pangol-v*) directory=packages/create-pangol; prefix=create-pangol-v ;;
            v*) directory=packages/pangol; prefix=v ;;
            *) exit 1 ;;
          esac
          version=$(node -p "require('./$directory/package.json').version")
          test "$prefix$version" = "$GITHUB_REF_NAME"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bun
      - run: pnpm build
      - name: Stage for publishing (a maintainer approves with 2FA)
        working-directory: ${{ steps.package.outputs.directory }}
        # The dist-tag is passed explicitly and cannot change once staged: npm 12 ignores
        # publishConfig.tag, and a prerelease must never become `latest`. 0.1.0-alpha.1 -> alpha.
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag="${version#*-}"; tag="${tag%%.*}" ;; *) tag=latest ;; esac
          npm stage publish --provenance --tag "$tag"
          echo "Staged $name@$version (tag $tag). Approve it: npm stage list $name && npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"
