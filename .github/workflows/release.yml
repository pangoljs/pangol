name: release
# Publishes packages/pangol to npm when a tag like v0.1.0-alpha.1 is pushed. The tag must match the
# version in packages/pangol/package.json. Prereleases go to their own dist-tag (alpha), never `latest`.
#
# Auth: npm trusted publishing (OIDC, no token) once it is set up for this repo on npmjs.com
# (package settings -> Trusted publishing -> GitHub Actions, workflow release.yml). Until then, an
# NPM_TOKEN repository secret (an npm automation token) is used if present.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # trusted publishing and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Tag matches package.json
        run: test "v$(node -p "require('./packages/pangol/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bun
      - run: pnpm build
      - name: Publish with provenance
        working-directory: packages/pangol
        # The dist-tag is passed explicitly: npm 12 ignores publishConfig.tag, and a prerelease must
        # never become `latest`. 0.1.0-alpha.1 -> alpha, 0.1.0 -> latest.
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag="${version#*-}"; tag="${tag%%.*}" ;; *) tag=latest ;; esac
          npm publish --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
